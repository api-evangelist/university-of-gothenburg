description: >-
  The metadata format vocabulary GUPEA actually advertises. Fourteen formats, all of them stock
  DSpace or standards-body schemas — unlike some peers in this cohort, the Gothenburg University
  Library has not added an institution-specific crosswalk of its own. Two entries are worth
  noting for what they say about who this repository serves: `uppsok`, the Swedish national
  student-thesis harvesting profile consumed by the national Uppsök/DiVA services, and `rioxx`
  v3.0, the UK research-outputs profile. The presence of `uppsok` is the clearest signal in this
  repository that GUPEA is wired into Swedish national infrastructure rather than run in isolation.
