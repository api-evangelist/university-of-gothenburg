aid: university-of-gothenburg
name: University of Gothenburg
x-type: university
x-category: Public Research University
description: 'The University of Gothenburg (Göteborgs universitet) is a public research university in
  Sweden, founded in 1891, with roughly 37,000 students and 6,000 employees. Its programmable footprint
  is larger and more genuinely its own than the June 2026 profile of this repository recorded, and it
  is concentrated in one place: Språkbanken Text, the Swedish Language Bank''s text division at the Department
  of Swedish, Multilingualism, Language Technology. Språkbanken publishes SIX OpenAPI documents from a
  single documentation index at ws.spraakbanken.gu.se/docs — Korp (corpus concordance search over 1,133
  corpora), Karp v7 and Karp search v1 (lexical resources), Mink (upload, annotate and publish your own
  corpus), Sparv (the annotation pipeline as a job service) and the Språkbanken Text Metadata API (a 1,499-resource
  catalogue with BibTeX export). All six run on University of Gothenburg hosts, carry sb-info@svenska.gu.se
  as contact, and answered anonymous requests with HTTP 200 on 2026-09-01. The Gothenburg University Library
  separately operates GUPEA on DSpace 8.3, exposing both an OAI-PMH 2.0 harvesting endpoint (fourteen
  metadata formats, including the Swedish national uppsok thesis profile) and a HAL+JSON REST API on gupea.ub.gu.se.
  The University also runs its own Shibboleth SAML 2.0 identity provider, published as machine-readable
  metadata through SWAMID and eduGAIN.


  What is thin here is PRODUCT, not surface. There is no central developer portal, no API programme, no
  changelog, no status page, no rate-limit signal, no support channel and no documented credential-issuance
  route for any of the write surfaces. Five of the six contracts declare a security scheme and not one
  explains how to obtain a credential; two of them publish relative servers[] and no contact at all. This
  is a research unit''s engineering that happens to be excellent, published without any of the institutional
  scaffolding that would make it findable. Everything else that looks like a University of Gothenburg
  API is a relationship rather than a contract — DOI registration with DataCite through the Swedish National
  Data Service and with Crossref directly, a Microsoft Entra tenancy on medarbetarportalen.gu.se — and
  those are recorded here with x-operator and no vendor contract stored.'
