- aid: university-of-gothenburg:university-of-gothenburg-searching-api
  name: University of Gothenburg Searching API
  description: "Searching is the main way to get data from Karp. If a query string is given, an actual\
    \ search will be done, otherwise all\nentries in the resource will be returned.\n\n- Use [`/query`](#tag/Searching/operation/query_query__resources__get)\
    \ to be given all the matching entries\n- Use [`/query/stats`](#tag/Searching/operation/query_stats_query_stats__resources__get)\
    \ to only be given the count of matches in each given resource\n\n### Query language\n\n#### Search\
    \ strings\n\nIn the examples below, `<string>` can be either:\n\n- any characters except `\"`, `|`,\
    \ `(` or `)`\n- any characters, enclosed in double quotes, but any `\"` inside the quotes must be\
    \ escaped with `\\`, for example: `equals|field|\"A \"good\" example\"`\n\nIn addition to these rules,\
    \ characters that are part of the URI syntax, such as `?` and `&` needs to be encoded. For example,\
    \ the whole query can be\nencoded using Javascript's `encodeURIComponent`.\n\n#### Query operators\n\
    \n- `contains|<field>|<string>` Find all entries where the field <field> contains <string>. More premissive\
    \ than equals.\n\n- `endswith|<field>|<string>` Find all entries where the field <field> ends with\
    \ <string>\n\n- `equals|<field>|<string>` Find all entries where <field> equals <string>. Stricter\
    \ than contains\n\n- `exists|<field>` Find all entries that has the field <field>.\n\n- `freetext|<string>`\
    \ Search in all fields for <string> and similar values.\n\n- `gt|<field>|<value>` Find all entries\
    \ where <field> is greater than <value>.\n\n- `gte|<field>|<value>` Find all entries where <field>\
    \ is greater than or equals <value>.\n\n- `lt|<field>|<value>` Find all entries where <field> is less\
    \ than <value>.\n\n- `lte|<field>|<value>` Find all entries where <field> is less than or equals <value>.\n\
    \n- `missing|<field>` Search for all entries that doesn't have the field <field>.\n\n- `regexp|<field>|<regex.*>`\
    \ Find all entries where the field <field> matches the regex <regex.*>.\n\n- `startswith|<field>|<string>`\
    \ Find all entries where <field>starts with <string>.\n\n#### Logical Operators\nThe logical operators\
    \ can be used both at top-level and lower-levels.\n\n- `not(<expression1>||<expression2>||...)` Find\
    \ all entries that doesn't match the expression <expression>.\n\n- `and(<expression1>||<expression2>||...)`\
    \ Find all entries that matches <expression1> AND <expression2>.\n\n- `or(<expression1>||<expression2>||...)`\
    \ Find all entries that matches <expression1> OR <expression2>.\n\n#### Sub-queries - searching in\
    \ collections of objects\n\nUsed for fields with setting `collection: true` and that contain other\
    \ fields (collection of objects). Boolean queries\nsuch as: `and(equals|my_field.x|1||equals|my_field.y|3)`\
    \ will find entries where objects in `my_field` \nmatch `equals|x|1` or `equals|y|3`, or both. To\
    \ find entries where an individual object in `my_field` matches a boolean query, \nwrap the query\
    \ with the sub-query notation: `my_field(and(equals|x|1||equals|y|3))`.\n\n- `<field>(expression)`\
    \ Do `<expression>` on objects inside `<field>`. `<field>` must be a collection. \n\n#### Regular\
    \ expressions\nAlways matches complete tokens.\n\n####  Examples\n- `not(missing|pos)`\n- `and(freergxp|str.*ng||regexp|pos|str.*ng)`\n\
    - `and(missing|pos||equals|wf||or|blomma|äpple`\n- `and(equals|wf|sitta||not||equals|wf|satt`"
  humanURL: https://ws.spraakbanken.gu.se/docs/korp
  baseURL: https://ws.spraakbanken.gu.se/ws/korp/v8
