  reason: covered
  detail: 'Real probes ran and found real institution-operated surfaces — considerably more than the June
    2026 profile of this repository recorded. Eight surfaces are the University''s own and were verified
    anonymously at HTTP 200 on 2026-09-01: six Språkbanken Text APIs, each with a PUBLISHED OpenAPI document
    (Korp, Metadata, Mink, Sparv, Karp v7, Karp search v1), plus the GUPEA DSpace 8.3 REST API and the
    GUPEA OAI-PMH 2.0 endpoint. A ninth, the University''s own Shibboleth SAML 2.0 identity provider,
    resolves to public metadata both directly and through SWAMID/eduGAIN.


    Two host-independent classes were found and repaired rather than deleted. Karp v7 and Karp search
    v1 are HOSTLESS as published — relative servers[] and no info.contact — so nothing in either document
    names its operator; both were attributed by the gu.se host serving them and re-based in openapi/,
    with the relative originals preserved unchanged in openapi/_original/. The DataCite membership is
    invisible to name search (both /providers?query=gothenburg and /clients?query=gothenburg return zero)
    and was found only by resolving a DOI the University minted.


    What is thin is DOCUMENTATION AND PRODUCT, not surface. There is no central developer portal — api.gu.se
    and data.gu.se do not resolve — no changelog, no status page, no rate-limit signal, no support channel
    for any API, and no documented credential-issuance route for any of the five declared security schemes.
    No AI policy or AI-tooling pointer was found on any English- or Swedish-language gu.se URL probed
    in this run, so none is claimed. No public course-catalog or timetable API exists: kursplaner.gu.se
    returns 404 and the programme catalogue is HTML only. One Språkbanken service, Strix, is registered
    at the edge but returned HTTP 503.


    One probe limitation to declare. www.gu.se serves nginx HTTP 403 for unknown paths, including /.well-known/security.txt
    and /llms.txt. That is a blanket edge deny, NOT evidence that those files were considered and withheld,
    and neither absence is scored here.'
